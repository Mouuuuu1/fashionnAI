<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wishlist — FashionAI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css"/>
<style>
.wishlist-page { margin-top: var(--nav-h); min-height: calc(100vh - var(--nav-h)); background: var(--cream); padding: 60px; }
.wishlist-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-top: 40px; }
.wishlist-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; }
.sale-alert { display: flex; align-items: center; gap: 10px; background: rgba(39,174,96,.1); border-left: 3px solid var(--success); padding: 14px 20px; margin-bottom: 32px; font-size: 13px; color: var(--success); font-weight: 600; }
</style>
</head>
<body>
<div class="wishlist-page">
  <div style="max-width:1320px;margin:0 auto;">
    <div class="wishlist-header">
      <div>
        <h1 style="font-family:'Anton',sans-serif;font-size:48px;letter-spacing:-.02em;color:var(--ink);">MY WISHLIST</h1>
        <p style="font-size:13px;color:var(--stone);margin-top:6px;" id="wishlist-subtitle">Loading…</p>
      </div>
      <div style="display:flex;gap:12px;">
        <button class="btn btn-ghost btn-sm" onclick="navigator.clipboard.writeText(location.href).then(()=>alert('Wishlist link copied!'))">Share Wishlist</button>
        <a href="catalog.html" class="btn btn-primary btn-sm">Continue Shopping</a>
      </div>
    </div>

    <div class="sale-alert" id="price-drop-alert" style="display:none;"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span id="price-drop-text"></span></div>

    <div class="wishlist-grid" id="wishlist-grid"><div style="grid-column:1/-1;text-align:center;padding:80px;color:var(--stone);">Loading wishlist…</div></div>

    <!-- Add all to cart -->
    <div id="wishlist-bulk" style="margin-top:40px;padding:32px;background:var(--white);display:none;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-size:14px;font-weight:700;color:var(--ink);" id="bulk-in-stock"></div>
        <div style="font-size:13px;color:var(--stone);margin-top:4px;" id="bulk-value"></div>
      </div>
      <button class="btn btn-primary" style="font-size:13px;padding:16px 36px;" onclick="addAllToCart()">Add All In-Stock to Cart</button>
    </div>
  </div>
</div>
<script src="api.js"></script>
<script src="components.js"></script>
<script>
if (!FashionAPI.requireAuth()) { /* redirecting */ }

let wishlistData = [];

async function loadWishlist() {
  try {
    wishlistData = await FashionAPI.get('/wishlist');
    renderWishlist();
  } catch(e) {
    document.getElementById('wishlist-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:80px;color:var(--danger);">Could not load wishlist.</div>';
  }
}

function renderWishlist() {
  const grid = document.getElementById('wishlist-grid');
  document.getElementById('wishlist-subtitle').textContent = wishlistData.length + ' saved item' + (wishlistData.length!==1?'s':'');

  if (wishlistData.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:80px;">
      <h2 style="font-family:Anton,sans-serif;font-size:28px;color:var(--ink);margin-bottom:12px;">YOUR WISHLIST IS EMPTY</h2>
      <p style="font-size:13px;color:var(--stone);margin-bottom:28px;">Save items you love and come back anytime.</p>
      <a href="catalog.html" class="btn btn-primary" style="display:inline-flex;">Explore Catalog</a>
    </div>`;
    document.getElementById('wishlist-bulk').style.display = 'none';
    document.getElementById('price-drop-alert').style.display = 'none';
    return;
  }

  // Price drop check
  const saleItems = wishlistData.filter(w => w.product.sale_price);
  if (saleItems.length > 0) {
    const item = saleItems[0];
    document.getElementById('price-drop-alert').style.display = 'flex';
    document.getElementById('price-drop-text').innerHTML = `Price drop: <strong>${item.product.name}</strong> is now ${FashionAPI.fmt(item.product.sale_price)} (was ${FashionAPI.fmt(item.product.price)})!`;
  }

  grid.innerHTML = wishlistData.map(w => {
    const p = w.product;
    const img = p.image || `https://placehold.co/400x533/d1d0cb/6e6353?text=${encodeURIComponent(p.name)}`;
    const price = p.sale_price ?? p.price;
    const salePct = p.sale_price ? Math.round((1 - p.sale_price/p.price)*100) : 0;
    const badge = p.stock === 0 ? '<span class="product-badge badge-out">Sold Out</span>'
                : salePct > 0   ? `<span class="product-badge badge-sale">−${salePct}%</span>` : '';
    const overlay = p.stock > 0
      ? `<div class="product-overlay"><button class="overlay-btn" onclick="event.preventDefault();addOneToCart(${p.id})">Add to Cart</button><a href="try-on.html" class="overlay-btn icon"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M3 21a9 9 0 0 1 18 0"/></svg></a></div>` : '';
    return `<div class="product-card">
      <div class="product-img">
        ${badge}
        <img src="${img}" alt="${p.name}" ${p.stock===0?'style="opacity:.6;"':''}/>
        ${overlay}
        <button class="wishlist-btn active" onclick="event.preventDefault();removeFromWishlist(${p.id})">
          <svg width="18" height="18" fill="currentColor" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        ${p.sale_price ? '<div style="position:absolute;bottom:14px;right:14px;z-index:2;background:var(--success);color:var(--white);font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:5px 10px;">Price Drop!</div>' : ''}
      </div>
      <a href="product.html?id=${p.id}" class="product-info" style="display:block;${p.stock===0?'opacity:.7;':''}">
        <div class="product-brand">${p.brand}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-price-row">
          <span class="product-price"><span class="egp">EGP</span>${Number(price).toLocaleString()}</span>
          ${p.sale_price ? `<span class="product-price-old">EGP ${Number(p.price).toLocaleString()}</span>` : ''}
        </div>
        <div class="product-rating"><span class="stars">${FashionAPI.stars(p.rating)}</span><span class="rating-count">(${p.reviews_count||0})</span></div>
        <div style="font-size:11px;${p.stock>0?'color:var(--success)':'color:var(--danger)'};margin-top:6px;font-weight:600;">${p.stock>0?'In Stock':'Out of Stock'}</div>
      </a>
    </div>`;
  }).join('');

  // Bulk bar
  const inStock = wishlistData.filter(w => w.product.stock > 0);
  const totalVal = inStock.reduce((s, w) => s + (w.product.sale_price ?? w.product.price), 0);
  const bulk = document.getElementById('wishlist-bulk');
  bulk.style.display = inStock.length > 0 ? 'flex' : 'none';
  document.getElementById('bulk-in-stock').textContent = inStock.length + ' item' + (inStock.length!==1?'s':'') + ' in stock';
  document.getElementById('bulk-value').textContent = 'Total value: ' + FashionAPI.fmt(totalVal);
}

async function removeFromWishlist(productId) {
  try {
    wishlistData = await FashionAPI.del('/wishlist/' + productId);
    const count = wishlistData.length;
    window.fashionAI?.updateWishlistCount(count);
    renderWishlist();
    window.fashionAI?.toast('Removed from wishlist');
  } catch(e) {
    window.fashionAI?.toast(e.message, 'error');
  }
}

async function addOneToCart(productId) {
  try {
    const p = await FashionAPI.get('/products/' + productId);
    const cartData = await FashionAPI.post('/cart', { product_id: productId, quantity: 1, size: p.sizes[0], color: p.colors[0] });
    window.fashionAI?.updateCartCount(cartData.item_count);
    window.fashionAI?.toast('Added to cart', 'success');
  } catch(e) {
    window.fashionAI?.toast(e.message, 'error');
  }
}

async function addAllToCart() {
  const inStock = wishlistData.filter(w => w.product.stock > 0);
  for (const w of inStock) {
    try {
      const p = await FashionAPI.get('/products/' + w.product.id);
      await FashionAPI.post('/cart', { product_id: w.product.id, quantity: 1, size: p.sizes[0], color: p.colors[0] });
    } catch(e) {}
  }
  try {
    const cartData = await FashionAPI.get('/cart');
    window.fashionAI?.updateCartCount(cartData.item_count);
  } catch(e) {}
  window.fashionAI?.toast(inStock.length + ' items added to cart', 'success');
}

loadWishlist();
</script>
</body>
</html>
